name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Finalizar compra do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências NPM
        run: npm install

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Inicializar Wrapper do Gradle
        run: |
          cd android
          gradle wrapper

      - name: Depuração de APK do compilador
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: terminaldiamanteblac-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

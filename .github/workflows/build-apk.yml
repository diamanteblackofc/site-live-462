name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Permissão de execução para Gradle
        run: echo "Ignorando chmod, usando gradle global"

      - name: Depuração de APK do compilador
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: terminaldiamanteblac-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

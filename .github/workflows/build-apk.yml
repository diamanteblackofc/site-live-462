name: Build APK Android — Terminal-DiamanteBlack

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências NPM
        run: npm install

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Permissão de execução para Gradle
- name: Compilar APK Debug
        run: cd android && gradle assembleDebug --no-daemon

      - name: Publicar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: terminaldiamanteblac-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Exibir caminho do APK
        run: |
          echo "✅ APK compilado com sucesso!"
          echo "📦 Arquivo: android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh android/app/build/outputs/apk/debug/ || echo "Verifique o artefato publicado acima."

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal v1.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #00ff88;
      --green-dim: #00cc6a;
      --green-glow: rgba(0,255,136,0.18);
      --red: #ff4444;
      --amber: #ffcc00;
      --bg: #050f07;
      --bg2: #0a1a0d;
      --border: rgba(0,255,136,0.2);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.08) 3px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* CRT vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 99;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0;
    }

    /* Header */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }

    #header-title {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--green);
      text-shadow: 0 0 12px var(--green);
    }

    #header-dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 11px; height: 11px;
      border-radius: 50%;
    }
    .dot-red   { background: #ff5f57; box-shadow: 0 0 6px #ff5f57; }
    .dot-amber { background: #febc2e; box-shadow: 0 0 6px #febc2e; }
    .dot-green { background: #28c840; box-shadow: 0 0 6px #28c840; }

    #status {
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.6;
    }

    /* Config bar */
    #config-bar {
      display: flex;
      gap: 10px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,255,136,0.03);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #config-bar input, #config-bar select {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--green-dim);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      padding: 4px 8px;
      outline: none;
      border-radius: 2px;
      transition: border-color .2s, box-shadow .2s;
    }

    #config-bar input:focus {
      border-color: var(--green);
      box-shadow: 0 0 8px var(--green-glow);
      color: var(--green);
    }

    #config-bar input::placeholder { opacity: 0.4; }

    #endpoint-input { flex: 1; min-width: 200px; }
    #key-input { width: 180px; }

    /* Output area */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      scroll-behavior: smooth;
    }

    #output::-webkit-scrollbar { width: 4px; }
    #output::-webkit-scrollbar-track { background: transparent; }
    #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .line {
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      animation: fadein .15s ease;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(2px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .line-system {
      color: var(--amber);
      text-shadow: 0 0 8px rgba(255,204,0,0.4);
    }
    .line-cmd {
      color: #fff;
      text-shadow: 0 0 6px rgba(255,255,255,0.2);
    }
    .line-output {
      color: var(--green);
      text-shadow: 0 0 8px var(--green-glow);
    }
    .line-error {
      color: var(--red);
      text-shadow: 0 0 8px rgba(255,68,68,0.4);
    }
    .line-info {
      color: #5af;
      opacity: 0.8;
    }

    /* Input row */
    #input-row {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
      gap: 8px;
    }

    #prompt-label {
      color: var(--green);
      font-size: 15px;
      text-shadow: 0 0 10px var(--green);
      flex-shrink: 0;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      caret-color: var(--green);
    }

    #send-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--green-dim);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      padding: 5px 14px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all .2s;
      border-radius: 2px;
    }

    #send-btn:hover {
      background: var(--green-glow);
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
    }

    /* Blinking cursor animation on idle */
    #cmd-input::selection { background: rgba(0,255,136,0.3); }

    /* Session badge */
    #session-badge {
      font-size: 10px;
      opacity: 0.35;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* Spinner */
    #spinner {
      display: none;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #spinner.active { display: inline-block; }
  </style>

<style>:root{--primary-color:#00ff00}a,button,[data-action]{color:#00ff00}</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div id="header-dots">
      <div class="dot dot-red"></div>
      <div class="dot dot-amber"></div>
      <div class="dot dot-green"></div>
    </div>
    <div id="header-title">TERMINAL v1.0</div>
    <div id="status">● CONECTADO</div>
  </div>

  <div id="config-bar">
    <input id="endpoint-input" type="text" placeholder="https://seu-endpoint.com/execute" title="Endpoint" />
    <input id="key-input"      type="password" placeholder="X-Master-Key" title="API Key" />
    <div id="session-badge">SESSION: —</div>
  </div>

  <div id="output"></div>

  <div id="input-row">
    <span id="prompt-label">$&nbsp;</span>
    <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" autofocus placeholder="digite um comando..." />
    <div id="spinner"></div>
    <button id="send-btn">ENTER</button>
  </div>

</div>

<script>
  // ── Gera UUID v4 ──────────────────────────────────────────────────────
  function uuidv4() {
    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
    );
  }

  const SESSION_ID = uuidv4();
  document.getElementById('session-badge').textContent = 'SESSION: ' + SESSION_ID;

  // ── Histórico de comandos ─────────────────────────────────────────────
  const cmdHistory = [];
  let historyIdx = -1;

  // ── Helpers de UI ─────────────────────────────────────────────────────
  const output   = document.getElementById('output');
  const input    = document.getElementById('cmd-input');
  const spinner  = document.getElementById('spinner');

  function addLine(text, cls = 'line-output') {
    const div = document.createElement('div');
    div.className = 'line ' + cls;
    div.textContent = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  }

  function setLoading(v) {
    spinner.classList.toggle('active', v);
    input.disabled = v;
  }

  // ── Boot messages ─────────────────────────────────────────────────────
  addLine('Terminal v1.0 - Conectado', 'line-system');
  addLine('Digite "help" para listar comandos disponíveis.', 'line-system');
  addLine('', 'line-output');

  // ── Comandos locais ───────────────────────────────────────────────────
  const LOCAL_CMDS = {
    help() {
      const lines = [
        'Comandos locais:',
        '  help         — exibe esta ajuda',
        '  clear        — limpa o terminal',
        '  session      — mostra o session_id atual',
        '  endpoint     — exibe o endpoint configurado',
        '',
        'Qualquer outro comando é enviado ao servidor.',
      ];
      lines.forEach(l => addLine(l, 'line-info'));
    },
    clear() {
      output.innerHTML = '';
    },
    session() {
      addLine('Session ID: ' + SESSION_ID, 'line-info');
    },
    endpoint() {
      const ep = document.getElementById('endpoint-input').value.trim();
      addLine('Endpoint: ' + (ep || '(não configurado)'), 'line-info');
    },
  };

  // ── Envio do comando ──────────────────────────────────────────────────
  async function sendCommand(cmd) {
    if (!cmd.trim()) return;

    // Histórico de navegação
    cmdHistory.unshift(cmd);
    historyIdx = -1;

    addLine('$ ' + cmd, 'line-cmd');

    // Comando local?
    if (LOCAL_CMDS[cmd.trim().toLowerCase()]) {
      LOCAL_CMDS[cmd.trim().toLowerCase()]();
      return;
    }

    const endpoint = document.getElementById('endpoint-input').value.trim();
    const apiKey   = document.getElementById('key-input').value.trim();

    if (!endpoint) {
      addLine('Erro: configure o endpoint no campo acima.', 'line-error');
      return;
    }

    setLoading(true);
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(apiKey ? { 'X-Master-Key': apiKey } : {}),
        },
        body: JSON.stringify({
          command: cmd,
          session_id: SESSION_ID,
          env: { PATH: '/usr/bin', HOME: '/home/user' },
        }),
      });

      if (!res.ok) {
        addLine(`Erro HTTP ${res.status}: ${res.statusText}`, 'line-error');
        return;
      }

      const data = await res.json();
      const out  = data.output ?? data.result ?? JSON.stringify(data, null, 2);
      String(out).split('\n').forEach(l => addLine(l, 'line-output'));

    } catch (e) {
      addLine('Erro de conexão: ' + e.message, 'line-error');
    } finally {
      setLoading(false);
    }
  }

  // ── Eventos ───────────────────────────────────────────────────────────
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const val = input.value;
      input.value = '';
      sendCommand(val);
    }
    // Navegar histórico com setas
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (historyIdx < cmdHistory.length - 1) {
        historyIdx++;
        input.value = cmdHistory[historyIdx];
      }
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIdx > 0) {
        historyIdx--;
        input.value = cmdHistory[historyIdx];
      } else {
        historyIdx = -1;
        input.value = '';
      }
    }
  });

  document.getElementById('send-btn').addEventListener('click', () => {
    const val = input.value;
    input.value = '';
    sendCommand(val);
    input.focus();
  });
</script>
